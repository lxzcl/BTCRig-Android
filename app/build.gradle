plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
}

def btcrigVersion = rootProject.file("VERSION").text.trim()
def btcrigVersionParts = btcrigVersion.tokenize(".")*.toInteger()
if (btcrigVersionParts.size() != 3) {
    throw new GradleException("VERSION must be major.minor.patch")
}
def btcrigVersionCode = btcrigVersionParts[0] * 10000 + btcrigVersionParts[1] * 100 + btcrigVersionParts[2]

android {
    namespace = "com.btcrig.android"
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    def signingFile = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasBtcrigSigning = signingFile &&
        System.getenv("ANDROID_KEYSTORE_PASSWORD") &&
        System.getenv("ANDROID_KEY_ALIAS") &&
        System.getenv("ANDROID_KEY_PASSWORD")

    defaultConfig {
        applicationId = "com.btcrig.android"
        minSdk = 21
        targetSdk = 36
        versionCode = btcrigVersionCode
        versionName = btcrigVersion
        externalNativeBuild {
            cmake {
                cFlags "-O3"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        if (hasBtcrigSigning) {
            btcrig {
                storeFile = file(signingFile)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasBtcrigSigning) {
                signingConfig = signingConfigs.btcrig
            }
        }
        release {
            if (hasBtcrigSigning) {
                signingConfig = signingConfigs.btcrig
            }
        }
    }

    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }

    buildFeatures {
        compose = true
    }

    packaging {
        jniLibs.useLegacyPackaging = true
    }

    sourceSets {
        main.jniLibs.srcDir(file("build/generated/xmrig/jniLibs"))
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

def xmrigOutput = layout.buildDirectory.dir("generated/xmrig/jniLibs")
def androidSdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
if (!androidSdkDir) {
    def localProperties = new Properties()
    rootProject.file("local.properties").withInputStream { localProperties.load(it) }
    androidSdkDir = localProperties.getProperty("sdk.dir")
}
def buildXmrigArm64 = tasks.register("buildXmrigArm64", Exec) {
    inputs.file(rootProject.file("scripts/build-xmrig-android.sh"))
    inputs.file(rootProject.file("scripts/xmrig-donate.patch"))
    inputs.dir(file("src/main/cpp/third_party/xmrig"))
    inputs.dir(file("src/main/cpp/third_party/libuv"))
    outputs.file(xmrigOutput.map { it.file("arm64-v8a/libxmrig.so") })
    commandLine "bash",
        rootProject.file("scripts/build-xmrig-android.sh"),
        androidSdkDir,
        xmrigOutput.get().asFile.absolutePath
}

tasks.named("preBuild").configure {
    dependsOn(buildXmrigArm64)
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2024.09.03")
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
