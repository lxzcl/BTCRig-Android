<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#eef2f8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f86b8"/>
      <stop offset="1" stop-color="#3f6797"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <style>
      .title{font:700 22px Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#172033}
      .sub{font:400 16px Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#6e7890}
      .dark{fill:#172033}
      .rig{fill:#4c6f9f}
    </style>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>

  <g transform="translate(100 70)">
    <rect x="0" y="0" width="240" height="240" rx="56" fill="#ffffff" filter="url(#shadow)"/>
    <text x="120" y="154" text-anchor="middle" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="92" font-weight="800">
      <tspan class="dark">B</tspan><tspan class="rig">R</tspan>
    </text>
    <text x="120" y="198" text-anchor="middle" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="700">
      <tspan class="dark">BTC</tspan><tspan class="rig">Rig</tspan>
    </text>
    <text class="title" x="120" y="310" text-anchor="middle">A / BR</text>
    <text class="sub" x="120" y="340" text-anchor="middle">最适合 App 图标</text>
  </g>

  <g transform="translate(480 70)">
    <rect x="0" y="0" width="240" height="240" rx="56" fill="#ffffff" filter="url(#shadow)"/>
    <text x="120" y="135" text-anchor="middle" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="50" font-weight="800">
      <tspan class="dark">BTC</tspan><tspan class="rig">Rig</tspan>
    </text>
    <rect x="66" y="162" width="108" height="10" rx="5" fill="url(#blue)" opacity="0.9"/>
    <text class="title" x="120" y="310" text-anchor="middle">B / BTCRig</text>
    <text class="sub" x="120" y="340" text-anchor="middle">品牌名完整，但小图标略吃亏</text>
  </g>

  <g transform="translate(860 70)">
    <rect x="0" y="0" width="240" height="240" rx="56" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="120" cy="120" r="70" fill="#eff4fb"/>
    <text x="120" y="154" text-anchor="middle" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="104" font-weight="850" class="dark">B</text>
    <circle cx="168" cy="78" r="12" fill="#4c6f9f"/>
    <text class="title" x="120" y="310" text-anchor="middle">C / B</text>
    <text class="sub" x="120" y="340" text-anchor="middle">最简洁，识别强但品牌弱</text>
  </g>

  <text x="600" y="465" text-anchor="middle" class="sub">BTCRig icon preview · #172033 + #4C6F9F · vector draft</text>
</svg>
